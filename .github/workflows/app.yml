name: app
on:
  pull_request:
    paths: ["app/**", "data/**", "docs/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "data/**", "docs/**", ".github/workflows/app.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
